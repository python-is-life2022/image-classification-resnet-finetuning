<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Webcam Object Recognition</title>
  <desc id="d">Banner with animated boxes and labels around a phone, a mug and a laptop</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#16123a"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf5ff"/>
      <stop offset="0.55" stop-color="#8ea2ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1050" cy="40" r="190" fill="#7cf5ff" opacity="0.06"/>
    <circle cx="150" cy="310" r="210" fill="#ff7ad9" opacity="0.06"/>

    <!-- soft object silhouettes -->
    <rect x="775" y="85" width="60" height="120" rx="10" fill="#ffffff" opacity="0.08"/>
    <rect x="905" y="150" width="70" height="65" rx="8" fill="#ffffff" opacity="0.08"/>
    <path d="M975 165 h18 a14 14 0 0 1 0 28 h-18" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>
    <rect x="1040" y="100" width="110" height="75" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="1025" y="180" width="140" height="12" rx="4" fill="#ffffff" opacity="0.08"/>

    <!-- scan line -->
    <rect x="640" y="0" width="3" height="320" fill="#7cf5ff" opacity="0.45" filter="url(#glow)">
      <animate attributeName="x" from="640" to="1200" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- detection box 1: phone -->
    <rect x="760" y="68" width="90" height="152" rx="6" fill="none" stroke="#7cf5ff" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
    </rect>
    <g>
      <rect x="760" y="44" width="150" height="22" rx="4" fill="#7cf5ff"/>
      <text x="768" y="60" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#06202a">Mobile phone 0.97</text>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- detection box 2: mug -->
    <rect x="890" y="132" width="118" height="98" rx="6" fill="none" stroke="#ff7ad9" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <g>
      <rect x="890" y="108" width="100" height="22" rx="4" fill="#ff7ad9"/>
      <text x="898" y="124" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#2a0620">Mug 0.93</text>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="1s" repeatCount="indefinite"/>
    </g>

    <!-- detection box 3: laptop -->
    <rect x="1015" y="84" width="165" height="122" rx="6" fill="none" stroke="#b6f56b" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <g>
      <rect x="1015" y="60" width="112" height="22" rx="4" fill="#b6f56b"/>
      <text x="1023" y="76" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#142405">Laptop 0.95</text>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="2s" repeatCount="indefinite"/>
    </g>

    <!-- live indicator -->
    <circle cx="68" cy="62" r="6" fill="#ff4d6d">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="84" y="67" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="14" font-weight="700" fill="#ff9db0" letter-spacing="2">LIVE</text>

    <!-- title -->
    <text x="60" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#title)">Webcam Object</text>
    <text x="60" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#title)">Recognition</text>
    <text x="60" y="236" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#aeb8dc">Open Images v7  ·  ResNet50  ·  TensorFlow  ·  Keras  ·  OpenCV</text>

    <rect x="60" y="256" width="335" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="78" y="276" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="14" fill="#7cf5ff">96 classes · real-time · live webcam</text>
  </g>
</svg>
